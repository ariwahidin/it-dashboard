<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Still in Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f7;
    --ink:#1f2937;
    --muted:#9aa3af;
    --yellow:#fbc02d;
    --yellow-d:#f5a623;
    --dark:#2b2f36;
    --orange:#ff7a2f;
    --orange-l:#ff9f5b;
    --light:#dfe3e8;
    --light-2:#e9ecf0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Nunito',sans-serif;
    background:radial-gradient(120% 100% at 50% 0%, #fafbfc 0%, #eef0f3 100%);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:32px;color:var(--ink);
    overflow-x:hidden;
  }
  .stage{
    position:relative;width:100%;max-width:1180px;aspect-ratio:1180/780;
  }
  /* floating decor */
  .decor{position:absolute;fill:#e3e6ea;opacity:.9;}
  .gear-1{top:30%;left:9%;width:90px;animation:spin 22s linear infinite;}
  .gear-2{top:38%;left:16%;width:60px;animation:spin 16s linear infinite reverse;}
  .cloud{position:absolute;background:#e7eaee;border-radius:40px;}
  .cloud-1{top:16%;right:8%;width:120px;height:46px;}
  .cloud-1::before{content:"";position:absolute;width:60px;height:60px;background:#e7eaee;border-radius:50%;top:-26px;left:24px;}
  .dot{position:absolute;border-radius:50%;background:#dfe3e8;}
  .d1{width:18px;height:18px;top:18%;left:16%;}
  .d2{width:10px;height:10px;top:25%;left:21%;}
  .d3{width:14px;height:14px;bottom:34%;right:14%;}
  .d4{width:8px;height:8px;bottom:38%;right:11%;}
  .dash{position:absolute;left:10%;top:52%;display:flex;gap:7px;}
  .dash span{width:16px;height:7px;border-radius:4px;background:#dfe3e8;}

  /* text */
  .copy{position:absolute;top:6%;left:50%;transform:translateX(-50%);text-align:center;z-index:5;width:auto;}
  .title{font-family:'Baloo 2',cursive;font-weight:800;font-size:clamp(38px,6.2vw,74px);line-height:.98;color:#222a38;letter-spacing:-1px;}
  .sub{margin-top:14px;color:#8b94a0;font-size:clamp(15px,1.7vw,21px);font-weight:600;line-height:1.35;white-space:nowrap;}
  .foot{position:absolute;bottom:3%;left:53%;transform:translateX(-50%);text-align:center;color:#9aa3af;font-weight:600;font-size:clamp(13px,1.5vw,18px);line-height:1.4;width:auto;white-space:nowrap;z-index:8;}

  /* browser window */
  .scene{position:absolute;inset:0;}
  .browser{
    position:absolute;left:29%;top:33%;width:48%;height:50%;
    background:#fff;border:7px solid var(--dark);border-radius:18px;
    box-shadow:0 30px 50px rgba(40,46,56,.12);
  }
  .bar{height:14%;border-bottom:3px solid #eef0f2;display:flex;align-items:center;padding-left:18px;gap:8px;background:#fafbfc;border-radius:11px 11px 0 0;}
  .bar i{width:13px;height:13px;border-radius:50%;display:inline-block;}
  .r{background:#ef5350;}.y{background:#fbc02d;}.g{background:#4caf50;}
  .pbiTab{margin-left:14px;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #eceff2;border-radius:7px;padding:3px 10px;font-size:9px;font-weight:700;color:#5a626c;}
  .pbiTab svg{width:11px;height:11px;}
  .dash-view{height:86%;width:100%;}
  .dash-view svg{width:100%;height:100%;display:block;border-radius:0 0 11px 11px;}

  /* crane */
  .crane{position:absolute;right:5%;bottom:8%;width:24%;height:62%;}
  .crane svg{width:100%;height:100%;overflow:visible;}
  .hook{animation:sway 4s ease-in-out infinite;transform-origin:top center;}

  /* signs / barriers */
  .barrier{position:absolute;left:36%;bottom:5%;width:24%;z-index:6;filter:drop-shadow(0 14px 14px rgba(0,0,0,.12));}
  .workSign{position:absolute;left:13%;bottom:12%;width:11%;z-index:4;filter:drop-shadow(0 12px 12px rgba(0,0,0,.12));}
  .roadblock{position:absolute;right:8%;bottom:14%;width:16%;z-index:3;filter:drop-shadow(0 12px 12px rgba(0,0,0,.1));}
  .cone{position:absolute;width:7%;z-index:7;}
  .cone-1{left:24%;bottom:6%;}
  .cone-2{right:18%;bottom:4%;}

  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes sway{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(5deg);}}

  .fade{opacity:0;animation:fade .8s ease forwards;}
  .delay1{animation-delay:.1s;}.delay2{animation-delay:.25s;}.delay3{animation-delay:.4s;}
  @keyframes fade{to{opacity:1;}}
</style>
</head>
